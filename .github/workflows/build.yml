name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  test:
    name: Analisi e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build windows --release
      - name: Pacchetto zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath BB-IPTV-Player-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BB-IPTV-Player-windows-x64
          path: BB-IPTV-Player-windows-x64.zip

  android:
    name: Android (completa + light)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Chiave di firma fissa (dai secret, se presenti)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/iptv-player.jks"
            echo "IPTV_KEYSTORE=$RUNNER_TEMP/iptv-player.jks" >> "$GITHUB_ENV"
          else
            echo "Secret ANDROID_KEYSTORE_BASE64 assente: firma di debug"
          fi
      - name: APK completa
        env:
          IPTV_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk BB-IPTV-Player-android.apk
      - name: APK light (proiettori/box da 1 GB, per architettura)
        env:
          IPTV_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: flutter build apk --release --split-per-abi --dart-define=FLAVOR=light
      - run: |
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk BB-IPTV-Player-android-light-armv7.apk
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk BB-IPTV-Player-android-light-arm64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BB-IPTV-Player-android
          path: BB-IPTV-Player-android*.apk
