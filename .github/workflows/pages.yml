name: Telecomando unico

# Pubblica su GitHub Pages il telecomando unico (assets/remote + web/remote).
# Una volta sola: Settings -> Pages -> Source: "GitHub Actions".
on:
  push:
    branches: [master, main]
    paths:
      - 'assets/remote/**'
      - 'assets/brand/**'
      - 'assets/channels/logos/**'
      - 'web/remote/**'
      - 'tool/build_web_remote.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 tool/build_web_remote.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
