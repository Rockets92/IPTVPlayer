<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<link rel="icon" href="/icon-192.png">
<title>Fonti EPG</title>
<style>
:root{--bg:#05070c;--ink:#0a0f1a;--stroke:rgba(255,255,255,.13);--hi:rgba(255,255,255,.22);
  --t1:#f2f5fb;--t2:rgba(226,233,246,.74);--t3:rgba(213,222,238,.5);--accent:#8ac6ff;--accent2:#3d7bff;--danger:#ff8a8a;--green:#3ccf7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(120% 60% at 20% -10%,rgba(61,123,255,.3),transparent 60%),
  radial-gradient(90% 50% at 110% 40%,rgba(138,198,255,.14),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 28px)}
h1{font-size:28px;letter-spacing:-.6px;margin:0 0 6px;font-weight:650}
.sub{color:var(--t2);margin:0 0 22px;line-height:1.45;font-size:15px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.04));border:1px solid var(--stroke);border-radius:26px;
  box-shadow:inset 0 1px 0 var(--hi),0 14px 40px rgba(0,0,0,.4);padding:20px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:16px;background:rgba(255,255,255,.07);margin-bottom:18px}
.seg button{border:0;border-radius:12px;padding:10px 0;font:inherit;font-weight:600;font-size:14.5px;color:var(--t2);background:none}
.seg button.on{background:rgba(255,255,255,.92);color:var(--ink)}
label{display:block;font-size:12.5px;font-weight:600;color:var(--t3);letter-spacing:.3px;margin:14px 0 7px}
input{width:100%;height:50px;border-radius:15px;border:1px solid var(--stroke);background:rgba(255,255,255,.07);color:var(--t1);
  font:inherit;font-size:16px;padding:0 15px;outline:0}
input:focus{border-color:rgba(138,198,255,.6);background:rgba(255,255,255,.1)}
input::placeholder{color:var(--t3)}
.hint{font-size:12.5px;color:var(--t3);margin-top:8px;line-height:1.45}
.go{margin-top:22px;width:100%;height:54px;border:0;border-radius:17px;font:inherit;font-size:16.5px;font-weight:650;color:var(--ink);
  background:linear-gradient(180deg,#a9d6ff,#5b95ff);box-shadow:0 10px 26px rgba(61,123,255,.4),inset 0 1px 0 rgba(255,255,255,.6)}
.go:disabled{opacity:.6}
.msg{margin-top:16px;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45;display:none}
.msg.err{display:block;background:rgba(255,90,95,.12);color:var(--danger);border:1px solid rgba(255,90,95,.3)}
.done{text-align:center;padding:28px 10px 10px;display:none}
.done .ok{width:72px;height:72px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(180deg,#9cceff,#5b95ff);box-shadow:0 10px 30px rgba(61,123,255,.5)}
.done h2{margin:0 0 8px;font-size:24px}
.done p{color:var(--t2);margin:0;line-height:1.5}
[hidden]{display:none!important}
.src{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid rgba(255,255,255,.07)}
.src:first-child{border-top:0;padding-top:2px}
.src span{flex:1;min-width:0;font-size:14px;color:var(--t2);word-break:break-all;line-height:1.35}
.src button{flex:none;width:38px;height:38px;border:0;border-radius:12px;display:grid;place-items:center;color:var(--danger);background:rgba(255,255,255,.07)}
.src svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.none{color:var(--t3);font-size:14px;padding:4px 0}
.ok{display:none;margin-top:16px;padding:12px 14px;border-radius:14px;font-size:14px;background:rgba(60,207,122,.12);color:#8ff0b6;border:1px solid rgba(60,207,122,.3)}
.ok.show{display:block}
h3{font-size:13px;font-weight:650;color:var(--t3);letter-spacing:.4px;margin:0 0 6px;text-transform:uppercase}
.card+.card{margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Fonti EPG</h1>
  <p class="sub">Aggiungi guide TV in formato XMLTV (anche .xml.gz): il player le scarica subito e le usa per i canali che la guida del provider non copre.</p>
  <div class="card">
    <label for="url" style="margin-top:0">Indirizzo della fonte</label>
    <input id="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…/guida.xml.gz">
    <button class="go" id="add">Aggiungi al player</button>
    <div class="msg" id="msg"></div>
    <div class="ok" id="ok"></div>
  </div>
  <div class="card">
    <h3>Fonti aggiunte</h3>
    <div id="list"><div class="none">Caricamento…</div></div>
  </div>
</div>
<script>
const T = '{{TOKEN}}';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const api = async (body) => {
  const r = await fetch('/api/epg-sources?t=' + encodeURIComponent(T), body === undefined ? {cache: 'no-store'} : {
    method: 'POST', cache: 'no-store', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body),
  });
  if (!r.ok) throw new Error(r.status);
  return r.json();
};
const render = (list) => {
  $('list').innerHTML = list.length ? list.map((u) => `
    <div class="src"><span>${esc(u)}</span>
      <button data-rm="${esc(u)}" aria-label="Rimuovi"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    </div>`).join('') : '<div class="none">Nessuna fonte aggiuntiva.</div>';
};
const fail = (m) => { $('msg').textContent = m; $('msg').className = 'msg err'; $('ok').className = 'ok'; };
const done = (m) => { $('ok').textContent = m; $('ok').className = 'ok show'; $('msg').className = 'msg'; };
const send = async (body, okMsg) => {
  try {
    const j = await api(body);
    render(j.sources || []);
    if (j.error) { fail(j.error); return false; }
    done(okMsg);
    return true;
  } catch (_) {
    fail('Il player non risponde. Controlla che telefono e player siano sulla stessa rete Wi-Fi.');
    return false;
  }
};
$('add').addEventListener('click', async () => {
  const u = $('url').value.trim();
  if (!u) { fail('Scrivi o incolla l\'indirizzo della fonte.'); return; }
  $('add').disabled = true;
  if (await send({add: u}, 'Fonte aggiunta: il player sta aggiornando la guida.')) $('url').value = '';
  $('add').disabled = false;
});
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('add').click(); });
$('list').addEventListener('click', (e) => {
  const b = e.target.closest('[data-rm]');
  if (b) send({remove: b.dataset.rm}, 'Fonte rimossa.');
});
api().then((j) => render(j.sources || [])).catch(() => fail('Il player non risponde. Controlla che telefono e player siano sulla stessa rete Wi-Fi.'));
</script>
</body>
</html>
